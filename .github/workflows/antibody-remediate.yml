name: Agent Antibody Remediate

on:
  workflow_run:
    workflows: ["Agent Antibody Candidate"]
    types: [completed]

permissions: {}

concurrency:
  group: antibody-remediate-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  evaluate_delta:
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
    steps:
      - name: Resolve and bind the source pull request
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ALLOWED_PR_AUTHOR: ${{ vars.AGENT_ANTIBODY_ALLOWED_PR_AUTHOR }}
        run: |
          PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$PR_NUMBER" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/source-pr.json"
          PR_AUTHOR="$(jq -r '.user.login // empty' "$RUNNER_TEMP/source-pr.json")"
          HEAD_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/source-pr.json")"
          HEAD_REF="$(jq -r '.head.ref' "$RUNNER_TEMP/source-pr.json")"
          HEAD_REPOSITORY="$(jq -r '.head.repo.full_name // empty' "$RUNNER_TEMP/source-pr.json")"
          BASE_SHA="$(jq -r '.base.sha' "$RUNNER_TEMP/source-pr.json")"
          if [ -z "$ALLOWED_PR_AUTHOR" ] || [ "$PR_AUTHOR" != "$ALLOWED_PR_AUTHOR" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Source pull request author is not authorized for Agent Antibody."
            exit 0
          fi
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_SHA" != "$WORKFLOW_HEAD_SHA" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$HEAD_REF" == antibody/* ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git check-ref-format --branch "$HEAD_REF" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/trusted-changed-files.txt"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Check out candidate tree without credentials
        if: steps.source.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Check out base immunity without credentials
        if: steps.source.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.base_sha }}
          path: base
          persist-credentials: false
          fetch-depth: 1

      - name: Download untrusted candidate evaluation
        if: steps.source.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: antibody-candidate-evaluation
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: candidate-artifact

      - name: Validate candidate artifact binding
        if: steps.source.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          ASSESSMENT=candidate-artifact/assessment.json
          test -f "$ASSESSMENT"
          test ! -L "$ASSESSMENT"
          test "$(wc -c < "$ASSESSMENT")" -le 1048576
          test "$(jq -r '.base_revision' "$ASSESSMENT")" = "$BASE_SHA"
          test "$(jq -r '.source_revision' "$ASSESSMENT")" = "$HEAD_SHA"
          jq -e '
            .schema_version == 2 and
            (.targets | type == "array") and
            (.status == "REVALIDATED" or .status == "INCONCLUSIVE")
          ' "$ASSESSMENT" >/dev/null
          rm -f candidate-artifact/remediation.json
          rm -rf -- candidate-artifact/delta-evaluation

      - name: Select one delta-specific Gemini evaluation
        id: delta
        if: steps.source.outputs.eligible == 'true'
        run: |
          TARGETS=()
          while IFS= read -r target; do
            DELTA="candidate-artifact/capability-deltas/$target.json"
            if [ ! -f "$DELTA" ] || [ -L "$DELTA" ]; then
              continue
            fi
            test "$(wc -c < "$DELTA")" -le 1048576
            if ! jq -e '
              .connector == "google-adk" and
              (.changes | type == "array") and
              (.attack_required_tools | type == "array") and
              (.attack_required_tools | length == 1)
            ' "$DELTA" >/dev/null; then
              continue
            fi
            if jq -e --arg target "$target" '
              any(.targets[];
                .target_id == $target and
                .status == "INCONCLUSIVE" and
                any(.inconclusive_reasons[];
                  contains("delta-specific attack campaign required")
                )
              )
            ' candidate-artifact/assessment.json >/dev/null; then
              TARGETS+=("$target")
            fi
          done < <(jq -r '.targets[].target_id' candidate-artifact/assessment.json)

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "evaluate=false" >> "$GITHUB_OUTPUT"
            echo "No single-tool delta requires trusted Gemini evaluation."
            exit 0
          fi
          if [ "${#TARGETS[@]}" -ne 1 ]; then
            echo "evaluate=false" >> "$GITHUB_OUTPUT"
            echo "Multiple delta targets remain INCONCLUSIVE; refusing partial remediation."
            exit 0
          fi
          echo "evaluate=true" >> "$GITHUB_OUTPUT"
          echo "target=${TARGETS[0]}" >> "$GITHUB_OUTPUT"

      - name: Install isolated evaluation dependencies
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.delta.outputs.evaluate == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.14.5"
          enable-cache: false

      - name: Prepare the candidate environment before authentication
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.delta.outputs.evaluate == 'true'
        run: |
          uv sync --project candidate --locked --dev
          test "$(git -C base rev-parse HEAD)" = "${{ steps.source.outputs.base_sha }}"
          git -C base diff --exit-code
          test -z "$(git -C base status --porcelain --untracked-files=all)"

      - name: Authenticate the Vertex-only evaluator
        id: evaluator_auth
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.delta.outputs.evaluate == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_EVALUATOR_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVALUATOR_SERVICE_ACCOUNT }}

      - name: Run bounded Gemini delta evaluation
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.delta.outputs.evaluate == 'true'
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          TARGET: ${{ steps.delta.outputs.target }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          AGENT_ANTIBODY_MODEL: ${{ vars.AGENT_ANTIBODY_MODEL }}
        run: |
          OUTPUT="$RUNNER_TEMP/delta-output"
          mkdir -p "$OUTPUT"
          artifact_digest() {
            find candidate-artifact -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d ' ' -f 1
          }
          INPUT_DIGEST="$(artifact_digest)"
          CHANGED_DIGEST="$(sha256sum "$RUNNER_TEMP/trusted-changed-files.txt" | cut -d ' ' -f 1)"
          env \
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_ID_TOKEN_REQUEST_URL \
            -u GH_TOKEN \
            -u GITHUB_TOKEN \
            uv run --project candidate --locked agent-antibody immunity evaluate-delta \
              --model "$AGENT_ANTIBODY_MODEL" \
              --target "$TARGET" \
              --memory-repository-root base \
              --candidate-repository-root candidate \
              --base-revision "$BASE_SHA" \
              --source-revision "$HEAD_SHA" \
              --changed-files "$RUNNER_TEMP/trusted-changed-files.txt" \
              --capability-delta "candidate-artifact/capability-deltas/$TARGET.json" \
              --output-dir "$OUTPUT"
          test -f "$OUTPUT/assessment.json"
          test ! -L "$OUTPUT/assessment.json"
          test "$(wc -c < "$OUTPUT/assessment.json")" -le 1048576
          test "$(artifact_digest)" = "$INPUT_DIGEST"
          test "$(sha256sum "$RUNNER_TEMP/trusted-changed-files.txt" | cut -d ' ' -f 1)" = "$CHANGED_DIGEST"
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          git -C base diff --exit-code
          test -z "$(git -C base status --porcelain --untracked-files=all)"

          rm -rf -- candidate-artifact/delta-evaluation
          mkdir -p candidate-artifact/delta-evaluation
          cp "$OUTPUT/assessment.json" candidate-artifact/delta-evaluation/assessment.json
          if [ -f "$OUTPUT/remediation.json" ]; then
            test ! -L "$OUTPUT/remediation.json"
            test "$(wc -c < "$OUTPUT/remediation.json")" -le 1048576
            cp "$OUTPUT/remediation.json" candidate-artifact/delta-evaluation/remediation.json
          fi

      - name: Remove evaluator credential material
        if: >-
          always() &&
          steps.source.outputs.eligible == 'true' &&
          steps.delta.outputs.evaluate == 'true'
        run: |
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            rm -f -- "$GOOGLE_APPLICATION_CREDENTIALS"
          fi

      - name: Upload trusted evaluation handoff
        if: steps.source.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: antibody-trusted-evaluation
          path: candidate-artifact
          if-no-files-found: error
          retention-days: 1

  create-immunity-pr:
    needs: evaluate_delta
    if: >-
      needs.evaluate_delta.result == 'success' &&
      needs.evaluate_delta.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Resolve and bind the source pull request
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ALLOWED_PR_AUTHOR: ${{ vars.AGENT_ANTIBODY_ALLOWED_PR_AUTHOR }}
        run: |
          PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$PR_NUMBER" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/source-pr.json"
          PR_AUTHOR="$(jq -r '.user.login // empty' "$RUNNER_TEMP/source-pr.json")"
          HEAD_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/source-pr.json")"
          HEAD_REF="$(jq -r '.head.ref' "$RUNNER_TEMP/source-pr.json")"
          HEAD_REPOSITORY="$(jq -r '.head.repo.full_name // empty' "$RUNNER_TEMP/source-pr.json")"
          BASE_SHA="$(jq -r '.base.sha' "$RUNNER_TEMP/source-pr.json")"
          if [ -z "$ALLOWED_PR_AUTHOR" ] || [ "$PR_AUTHOR" != "$ALLOWED_PR_AUTHOR" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Source pull request author is not authorized for Agent Antibody."
            exit 0
          fi
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_SHA" != "$WORKFLOW_HEAD_SHA" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$HEAD_REF" == antibody/* ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git check-ref-format --branch "$HEAD_REF" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/trusted-changed-files.txt"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Check out trusted control plane
        if: steps.source.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control-plane
          persist-credentials: false

      - name: Check out candidate tree without credentials
        if: steps.source.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Download trusted evaluation handoff
        if: steps.source.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: antibody-trusted-evaluation
          path: candidate-artifact

      - name: Validate artifact binding before trusted apply
        if: steps.source.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          ASSESSMENT=candidate-artifact/assessment.json
          test -f "$ASSESSMENT"
          test ! -L "$ASSESSMENT"
          test "$(wc -c < "$ASSESSMENT")" -le 1048576
          test "$(jq -r '.base_revision' "$ASSESSMENT")" = "$BASE_SHA"
          test "$(jq -r '.source_revision' "$ASSESSMENT")" = "$HEAD_SHA"
          jq -e '
            .schema_version == 2 and
            (.targets | type == "array") and
            (.status == "REVALIDATED" or .status == "INCONCLUSIVE")
          ' "$ASSESSMENT" >/dev/null
          test ! -e candidate-artifact/remediation.json

      - name: Install trusted control-plane dependencies
        if: steps.source.outputs.eligible == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.14.5"
          enable-cache: true

      - name: Merge only the evaluator delta result
        if: steps.source.outputs.eligible == 'true'
        working-directory: control-plane
        run: |
          uv sync --locked --dev
          DELTA_ASSESSMENT="$GITHUB_WORKSPACE/candidate-artifact/delta-evaluation/assessment.json"
          DELTA_REMEDIATION="$GITHUB_WORKSPACE/candidate-artifact/delta-evaluation/remediation.json"
          if [ ! -f "$DELTA_ASSESSMENT" ]; then
            echo "No trusted delta result was produced."
            exit 0
          fi
          test ! -L "$DELTA_ASSESSMENT"
          test "$(wc -c < "$DELTA_ASSESSMENT")" -le 1048576
          uv run --locked agent-antibody immunity merge-assessments \
            --base "$GITHUB_WORKSPACE/candidate-artifact/assessment.json" \
            --replacement "$DELTA_ASSESSMENT" \
            --output "$RUNNER_TEMP/merged-assessment.json"
          mv "$RUNNER_TEMP/merged-assessment.json" \
            "$GITHUB_WORKSPACE/candidate-artifact/assessment.json"
          rm -f "$GITHUB_WORKSPACE/candidate-artifact/remediation.json"
          if [ -f "$DELTA_REMEDIATION" ]; then
            test ! -L "$DELTA_REMEDIATION"
            test "$(wc -c < "$DELTA_REMEDIATION")" -le 1048576
            cp "$DELTA_REMEDIATION" \
              "$GITHUB_WORKSPACE/candidate-artifact/remediation.json"
          fi

      - name: Validate merged assessment
        if: steps.source.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          ASSESSMENT=candidate-artifact/assessment.json
          test "$(jq -r '.base_revision' "$ASSESSMENT")" = "$BASE_SHA"
          test "$(jq -r '.source_revision' "$ASSESSMENT")" = "$HEAD_SHA"
          jq -e '
            .schema_version == 2 and
            (.targets | type == "array") and
            (.status == "REVALIDATED" or .status == "BYPASS_CONFIRMED" or .status == "INCONCLUSIVE")
          ' "$ASSESSMENT" >/dev/null

      - name: Select only a verified bypass for remediation
        id: assessment
        if: steps.source.outputs.eligible == 'true'
        run: |
          STATUS="$(jq -r '.status' candidate-artifact/assessment.json)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "BYPASS_CONFIRMED" ]; then
            echo "remediate=false" >> "$GITHUB_OUTPUT"
            echo "Candidate status is $STATUS; no immunity pull request will be created."
            exit 0
          fi
          test -f candidate-artifact/remediation.json
          test ! -L candidate-artifact/remediation.json
          test "$(wc -c < candidate-artifact/remediation.json)" -le 1048576
          echo "remediate=true" >> "$GITHUB_OUTPUT"

      - name: Audit source pull request immutable memory
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        working-directory: control-plane
        run: |
          uv sync --locked --dev
          uv run --locked agent-antibody immunity audit \
            --repository-root "$GITHUB_WORKSPACE/candidate" \
            --base-revision "$BASE_SHA" \
            --head-revision "$HEAD_SHA"

      - name: Apply and verify immunity in the uncredentialed candidate tree
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          HEAD_REF: ${{ steps.source.outputs.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        working-directory: candidate
        run: |
          input_digest() {
            find "$GITHUB_WORKSPACE/candidate-artifact" -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d ' ' -f 1
          }
          INPUT_DIGEST="$(input_digest)"
          env \
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_ID_TOKEN_REQUEST_URL \
            -u GITHUB_TOKEN \
            -u GH_TOKEN \
            -u GOOGLE_APPLICATION_CREDENTIALS \
            -u GITHUB_ENV \
            -u GITHUB_OUTPUT \
            -u GITHUB_PATH \
            -u GITHUB_STATE \
            -u GITHUB_STEP_SUMMARY \
            uv sync --locked --dev
          BRANCH="antibody/pr-${PR_NUMBER}-${HEAD_SHA:0:12}"
          env \
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_ID_TOKEN_REQUEST_URL \
            -u GITHUB_TOKEN \
            -u GH_TOKEN \
            -u GOOGLE_APPLICATION_CREDENTIALS \
            -u GITHUB_ENV \
            -u GITHUB_OUTPUT \
            -u GITHUB_PATH \
            -u GITHUB_STATE \
            -u GITHUB_STEP_SUMMARY \
            uv run --locked agent-antibody immunity apply \
            --evaluation "$GITHUB_WORKSPACE/candidate-artifact/remediation.json" \
            --assessment "$GITHUB_WORKSPACE/candidate-artifact/assessment.json" \
            --repository-root "$GITHUB_WORKSPACE/candidate" \
            --lifecycle-state verified_pending_review \
            --source-pr-number "$PR_NUMBER" \
            --source-pr-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER" \
            --remediation-branch "$BRANCH" \
            --workflow-run-url "$RUN_URL" \
            --trusted-source-revision "$HEAD_SHA" \
            --trusted-changed-files "$RUNNER_TEMP/trusted-changed-files.txt"
          test "$(input_digest)" = "$INPUT_DIGEST"
          if ! git diff --quiet -- . ':(exclude)immunities/v1'; then
            echo "Candidate execution modified source files outside immutable immunity storage." >&2
            exit 1
          fi
          if git ls-files --others --exclude-standard -- . ':(exclude)immunities/v1' | grep -q .; then
            echo "Candidate execution created files outside immutable immunity storage." >&2
            exit 1
          fi

      - name: Stage candidate-generated immutable memory
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        run: |
          STAGE="$RUNNER_TEMP/prepared-immunity"
          rm -rf -- "$STAGE"
          test -f candidate/immunities/v1/snapshot.json
          test ! -L candidate/immunities/v1/snapshot.json
          if find candidate/immunities/v1 ! -type d ! -type f -print -quit | grep -q .; then
            echo "Generated immunity storage contains a non-regular path." >&2
            exit 1
          fi
          test "$(du -sb candidate/immunities/v1 | cut -f1)" -le 10485760
          mkdir -p "$STAGE"
          cp -R candidate/immunities "$STAGE/"

      - name: Re-check out candidate tree before GitHub write
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Restore staged immutable memory only
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        run: |
          STAGE="$RUNNER_TEMP/prepared-immunity"
          test -f "$STAGE/immunities/v1/snapshot.json"
          test ! -L "$STAGE/immunities/v1/snapshot.json"
          if find "$STAGE/immunities/v1" ! -type d ! -type f -print -quit | grep -q .; then
            echo "Staged immunity storage contains a non-regular path." >&2
            exit 1
          fi
          cp -R "$STAGE/immunities" "$GITHUB_WORKSPACE/candidate/"
          if ! git -C candidate diff --quiet -- . ':(exclude)immunities/v1'; then
            echo "Restored output modified source files outside immutable immunity storage." >&2
            exit 1
          fi

      - name: Create stacked immunity pull request
        id: create_immunity_pr
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          HEAD_REF: ${{ steps.source.outputs.head_ref }}
        run: |
          BRANCH="antibody/pr-${PR_NUMBER}-${HEAD_SHA:0:12}"
          BRANCH_EXISTS="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$BRANCH" | jq --arg branch "refs/heads/$BRANCH" '[.[] | select(.ref == $branch)] | length')"
          if [ "$BRANCH_EXISTS" != "0" ]; then
            echo "A remediation branch already exists; leaving it untouched."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXISTING_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json url --jq '.[0].url // empty')"
          if [ -n "$EXISTING_PR" ]; then
            echo "A remediation pull request already exists; leaving it untouched."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd candidate
          git switch --create "$BRANCH"
          git add -- immunities/v1
          if git diff --cached --quiet; then
            echo "No new immutable immunity memory was needed."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS=$'\t' read -r status path; do
            if [[ "$path" == "immunities/v1/snapshot.json" ]]; then
              [[ "$status" == "A" || "$status" == "M" ]] || exit 1
            elif [[ "$path" =~ ^immunities/v1/[a-z][a-z0-9-]*/imm-[a-z][a-z0-9-]*-[0-9a-f]{20}\.yaml$ ]]; then
              [[ "$status" == "A" ]] || exit 1
            else
              echo "Refusing to commit a non-immutable path: $path" >&2
              exit 1
            fi
          done < <(git diff --cached --name-status)
          git -c core.hooksPath=/dev/null config user.name "agent-antibody[bot]"
          git -c core.hooksPath=/dev/null config user.email "agent-antibody[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "chore(immunity): add generated regression memory"
          CURRENT_HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "Source pull request head changed while remediation was prepared; aborting." >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$BRANCH"
          PR_URL="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$HEAD_REF" --state open --json url --jq '.[0].url')"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$HEAD_REF" --head "$BRANCH" --draft --title "chore(immunity): add Agent Antibody regression memory" --body "Generated from source PR #${PR_NUMBER} at ${HEAD_SHA}.\n\nThis stacked PR contains only immutable policy-and-regression memory. Review it before merging into the source branch.")"
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Link the immutable snapshot to the generated pull request
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true' &&
          steps.create_immunity_pr.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          PR_URL: ${{ steps.create_immunity_pr.outputs.pr_url }}
        working-directory: candidate
        run: |
          test -n "$PR_URL"
          BRANCH="antibody/pr-${PR_NUMBER}-${HEAD_SHA:0:12}"
          SNAPSHOT="immunities/v1/snapshot.json"
          test -f "$SNAPSHOT"
          test ! -L "$SNAPSHOT"
          test "$(jq -r '.source_revision' "$SNAPSHOT")" = "$HEAD_SHA"
          test "$(jq -r '.lifecycle.source_pr_number' "$SNAPSHOT")" = "$PR_NUMBER"
          test "$(jq -r '.lifecycle.remediation_branch' "$SNAPSHOT")" = "$BRANCH"
          test "$(jq -r '.lifecycle.state' "$SNAPSHOT")" = "verified_pending_review"
          test "$(jq -r '.lifecycle.evaluation_status' "$SNAPSHOT")" = "BYPASS_CONFIRMED"
          TEMP_SNAPSHOT="$(mktemp)"
          jq --arg pr_url "$PR_URL" '.lifecycle.remediation_pr_url = $pr_url' \
            "$SNAPSHOT" > "$TEMP_SNAPSHOT"
          mv "$TEMP_SNAPSHOT" "$SNAPSHOT"
          git add -- immunities/v1/snapshot.json
          if ! git diff --cached --quiet; then
            if git diff --cached --name-only | grep -vx 'immunities/v1/snapshot.json' | grep -q .; then
              echo "Snapshot linkage may only modify the dashboard snapshot." >&2
              exit 1
            fi
            git -c core.hooksPath=/dev/null commit -m "chore(immunity): link generated pull request"
            CURRENT_HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
              echo "Source pull request head changed while snapshot linkage was prepared; aborting." >&2
              exit 1
            fi
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
