name: Agent Antibody Remediate

on:
  workflow_run:
    workflows: ["Agent Antibody Candidate"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: antibody-remediate-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  create-immunity-pr:
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve and bind the source pull request
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$PR_NUMBER" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/source-pr.json"
          HEAD_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/source-pr.json")"
          HEAD_REF="$(jq -r '.head.ref' "$RUNNER_TEMP/source-pr.json")"
          HEAD_REPOSITORY="$(jq -r '.head.repo.full_name // empty' "$RUNNER_TEMP/source-pr.json")"
          BASE_SHA="$(jq -r '.base.sha' "$RUNNER_TEMP/source-pr.json")"
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_SHA" != "$WORKFLOW_HEAD_SHA" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$HEAD_REF" == antibody/* ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git check-ref-format --branch "$HEAD_REF" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/trusted-changed-files.txt"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Check out trusted control plane
        if: steps.source.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control-plane
          persist-credentials: false

      - name: Check out candidate tree without executing it
        if: steps.source.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Download data-only candidate evaluation
        if: steps.source.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: antibody-candidate-evaluation
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: candidate-artifact

      - name: Validate artifact binding before trusted apply
        if: steps.source.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          ASSESSMENT=candidate-artifact/assessment.json
          test -f "$ASSESSMENT"
          test "$(wc -c < "$ASSESSMENT")" -le 1048576
          test "$(jq -r '.base_revision' "$ASSESSMENT")" = "$BASE_SHA"
          test "$(jq -r '.source_revision' "$ASSESSMENT")" = "$HEAD_SHA"
          jq -e '.schema_version == 2 and (.targets | type == "array") and (.status == "REVALIDATED" or .status == "BYPASS_CONFIRMED" or .status == "INCONCLUSIVE")' "$ASSESSMENT" >/dev/null

      - name: Select only a verified bypass for remediation
        id: assessment
        if: steps.source.outputs.eligible == 'true'
        run: |
          STATUS="$(jq -r '.status' candidate-artifact/assessment.json)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "BYPASS_CONFIRMED" ]; then
            echo "remediate=false" >> "$GITHUB_OUTPUT"
            echo "Candidate status is $STATUS; no immunity pull request will be created."
            exit 0
          fi
          test -f candidate-artifact/remediation.json
          test "$(wc -c < candidate-artifact/remediation.json)" -le 1048576
          echo "remediate=true" >> "$GITHUB_OUTPUT"

      - name: Install trusted control-plane dependencies
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.14.5"
          enable-cache: true

      - name: Audit source pull request immutable memory
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        working-directory: control-plane
        run: |
          uv sync --locked --dev
          uv run --locked agent-antibody immunity audit \
            --repository-root "$GITHUB_WORKSPACE/candidate" \
            --base-revision "$BASE_SHA" \
            --head-revision "$HEAD_SHA"

      - name: Apply only validated immunity files
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          HEAD_REF: ${{ steps.source.outputs.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        working-directory: control-plane
        run: |
          uv sync --locked --dev
          BRANCH="antibody/pr-${PR_NUMBER}-${HEAD_SHA:0:12}"
          uv run --locked agent-antibody immunity apply \
            --evaluation "$GITHUB_WORKSPACE/candidate-artifact/remediation.json" \
            --assessment "$GITHUB_WORKSPACE/candidate-artifact/assessment.json" \
            --repository-root "$GITHUB_WORKSPACE/candidate" \
            --lifecycle-state verified_pending_review \
            --source-pr-number "$PR_NUMBER" \
            --source-pr-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER" \
            --remediation-branch "$BRANCH" \
            --workflow-run-url "$RUN_URL" \
            --trusted-source-revision "$HEAD_SHA" \
            --trusted-changed-files "$RUNNER_TEMP/trusted-changed-files.txt"

      - name: Create stacked immunity pull request
        id: create_immunity_pr
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          HEAD_REF: ${{ steps.source.outputs.head_ref }}
        run: |
          BRANCH="antibody/pr-${PR_NUMBER}-${HEAD_SHA:0:12}"
          BRANCH_EXISTS="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$BRANCH" | jq --arg branch "refs/heads/$BRANCH" '[.[] | select(.ref == $branch)] | length')"
          if [ "$BRANCH_EXISTS" != "0" ]; then
            echo "A remediation branch already exists; leaving it untouched."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXISTING_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json url --jq '.[0].url // empty')"
          if [ -n "$EXISTING_PR" ]; then
            echo "A remediation pull request already exists; leaving it untouched."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd candidate
          git switch --create "$BRANCH"
          git add -- immunities/v1
          if git diff --cached --quiet; then
            echo "No new immutable immunity memory was needed."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^immunities/v1/(snapshot\.json|[a-z][a-z0-9-]*/imm-[a-z][a-z0-9-]*-[0-9a-f]{20}\.yaml)$' | grep -q .; then
            echo "Refusing to commit paths outside immutable immunity storage" >&2
            exit 1
          fi
          git -c core.hooksPath=/dev/null config user.name "agent-antibody[bot]"
          git -c core.hooksPath=/dev/null config user.email "agent-antibody[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "chore(immunity): add generated regression memory"
          CURRENT_HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "Source pull request head changed while remediation was prepared; aborting." >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$BRANCH"
          PR_URL="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$HEAD_REF" --state open --json url --jq '.[0].url')"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$HEAD_REF" --head "$BRANCH" --draft --title "chore(immunity): add Agent Antibody regression memory" --body "Generated from source PR #${PR_NUMBER} at ${HEAD_SHA}.\n\nThis stacked PR contains only immutable policy-and-regression memory. Review it before merging into the source branch.")"
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Link the immutable snapshot to the generated pull request
        if: >-
          steps.source.outputs.eligible == 'true' &&
          steps.assessment.outputs.remediate == 'true' &&
          steps.create_immunity_pr.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          PR_URL: ${{ steps.create_immunity_pr.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        working-directory: control-plane
        run: |
          test -n "$PR_URL"
          BRANCH="antibody/pr-${PR_NUMBER}-${HEAD_SHA:0:12}"
          uv run --locked agent-antibody immunity apply \
            --evaluation "$GITHUB_WORKSPACE/candidate-artifact/remediation.json" \
            --assessment "$GITHUB_WORKSPACE/candidate-artifact/assessment.json" \
            --repository-root "$GITHUB_WORKSPACE/candidate" \
            --lifecycle-state verified_pending_review \
            --source-pr-number "$PR_NUMBER" \
            --source-pr-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER" \
            --remediation-branch "$BRANCH" \
            --remediation-pr-url "$PR_URL" \
            --workflow-run-url "$RUN_URL" \
            --trusted-source-revision "$HEAD_SHA" \
            --trusted-changed-files "$RUNNER_TEMP/trusted-changed-files.txt" \
            --refresh-snapshot
          cd "$GITHUB_WORKSPACE/candidate"
          git add -- immunities/v1/snapshot.json
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "chore(immunity): link generated pull request"
            CURRENT_HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
              echo "Source pull request head changed while snapshot linkage was prepared; aborting." >&2
              exit 1
            fi
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
