name: Agent Antibody Candidate

on:
  pull_request:
    paths:
      - "src/agent_antibody/**"
      - "pyproject.toml"
      - "uv.lock"
      - "policies/**"
      - "scenarios/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Target to evaluate"
        required: true
        default: all
        type: choice
        options:
          - all
          - opsmate
          - repomate
          - supportmate

permissions:
  contents: read

concurrency:
  group: antibody-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: >-
      github.event_name != 'pull_request' ||
      !startsWith(github.event.pull_request.head.ref, 'antibody/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.14.5"
          enable-cache: false

      - name: Prepare changed-path input
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" \
              | LC_ALL=C sort -u > "$RUNNER_TEMP/changed-files.txt"
          else
            git ls-files src/agent_antibody | LC_ALL=C sort -u > "$RUNNER_TEMP/changed-files.txt"
          fi

      - name: Evaluate candidate with read-only credentials
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET: ${{ github.event.inputs.target || 'auto' }}
        run: |
          uv sync --locked --dev
          uv run --locked agent-antibody immunity evaluate \
            --repository-root . \
            --source-revision "$HEAD_SHA" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --target "$TARGET" \
            --output "$RUNNER_TEMP/evaluation.json"
          jq '{source_revision, targets: [.candidates[] | {target_id: .artifact.target_id, artifact_id: .artifact.artifact_id, action}], requires_remediation: ([.candidates[] | select(.action == "create")] | length > 0)}' "$RUNNER_TEMP/evaluation.json"

      - name: Upload data-only candidate evaluation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: antibody-candidate-evaluation
          path: ${{ runner.temp }}/evaluation.json
          if-no-files-found: error
          retention-days: 1
