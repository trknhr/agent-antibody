<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Antibody</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #07090c;
        color: #ecf1f7;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 20%, #1e2936, #07090c 45%); }
      main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 32px; }
      h1 { margin: 0; font-size: clamp(34px, 6vw, 72px); letter-spacing: -0.06em; }
      header p { color: #9aa8b7; max-width: 520px; line-height: 1.6; }
      button { border: 1px solid #8ff0c7; color: #07110e; background: #8ff0c7; padding: 12px 18px; font: inherit; cursor: pointer; }
      button.secondary { color: #8ff0c7; background: transparent; }
      button:disabled { cursor: wait; opacity: .55; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
      .runs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .card { border: 1px solid #2d3845; background: rgba(11, 15, 20, 0.86); padding: 20px; min-height: 210px; }
      .card small { color: #7f8c99; text-transform: uppercase; }
      .status { font-size: 30px; margin: 34px 0 16px; }
      .infected { color: #ff647c; }
      .immune, .healthy { color: #8ff0c7; }
      dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; margin: 0; color: #b8c3ce; }
      dd { margin: 0; color: #fff; }
      .metrics { margin-top: 14px; border: 1px solid #2d3845; padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .metric strong { display: block; font-size: 24px; margin-top: 8px; }
      pre { margin-top: 14px; border: 1px solid #2d3845; background: #080b0f; padding: 20px; overflow: auto; max-height: 300px; color: #aebbc8; }
      @media (max-width: 760px) { header { align-items: start; flex-direction: column; } .runs, .metrics { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Agent Antibody</h1><p>Attack the agent before production. Preserve confirmed failures as policy and regression memory.</p></div>
        <div class="actions">
          <button class="secondary" id="run">Run deterministic</button>
          <button id="run-live" disabled>Run live Gemini</button>
        </div>
      </header>
      <section class="runs" id="runs" aria-live="polite"></section>
      <section class="metrics" id="metrics"></section>
      <pre id="trace">Press “Run attack” to execute the deterministic security evaluation.</pre>
    </main>
    <script>
      const labels = { vulnerable: "Malicious / vulnerable", protected: "Malicious / protected", normal: "Normal / protected" };
      const runButton = document.querySelector("#run");
      const liveButton = document.querySelector("#run-live");
      const runs = document.querySelector("#runs");
      const metrics = document.querySelector("#metrics");
      const trace = document.querySelector("#trace");
      function card(key, run) {
        const service = run.scenario.service;
        const before = run.initial_state.replicas[service];
        const after = run.final_state.replicas[service];
        const status = run.oracle.status.toLowerCase();
        return `<article class="card"><small>${labels[key]}</small><div class="status ${status}">${run.oracle.status}</div><dl><dt>Policy</dt><dd>${run.mode}</dd><dt>Replicas</dt><dd>${before} → ${after}</dd><dt>Dangerous requests</dt><dd>${run.oracle.dangerous_request_count}</dd><dt>Issues</dt><dd>${run.final_state.issues.length}</dd></dl></article>`;
      }
      function setBusy(busy) {
        runButton.disabled = busy;
        liveButton.disabled = busy || liveButton.dataset.enabled !== "true";
      }
      function renderRuns(data, isLive) {
        runs.innerHTML = ["vulnerable", "protected", "normal"].map(key => card(key, data[key])).join("");
        const before = data.vulnerable.oracle.attack_succeeded ? "1/1 (100%)" : "0/1 (0%)";
        const after = data.protected.oracle.attack_succeeded ? "1/1 (100%)" : "0/1 (0%)";
        const normal = data.normal.oracle.normal_task_succeeded ? "1/1 (100%)" : "0/1 (0%)";
        metrics.innerHTML = `<div class="metric"><small>Attack success</small><strong>${before} → ${after}</strong></div><div class="metric"><small>Normal task</small><strong>${normal}</strong></div><div class="metric"><small>Status</small><strong>${data.vulnerable.oracle.status} → ${data.protected.oracle.status}</strong></div>`;
        if (isLive) {
          const policy = JSON.stringify(data.antibody.rules, null, 2);
          trace.textContent = `LIVE GEMINI PIPELINE\n\nAttack Agent payload:\n${data.selected_attack.payload}\n\nAntibody Agent proposal:\n${policy}\n\nProtected trace:\n` + data.protected.events.map(event => `${String(event.sequence).padStart(2, "0")} ${event.event_type.padEnd(20)} ${event.tool || "-"}`).join("\n");
        } else {
          trace.textContent = data.protected.events.map(event => `${String(event.sequence).padStart(2, "0")} ${event.event_type.padEnd(20)} ${event.tool || "-"}`).join("\n");
        }
      }
      runButton.addEventListener("click", async () => {
        setBusy(true); runButton.textContent = "Running…"; trace.textContent = "Executing deterministic attack and regression scenarios…";
        try {
          const response = await fetch("/api/demo");
          const data = await response.json();
          renderRuns(data, false);
        } catch (error) { trace.textContent = String(error); }
        finally { setBusy(false); runButton.textContent = "Run deterministic"; }
      });
      liveButton.addEventListener("click", async () => {
        setBusy(true); liveButton.textContent = "Gemini running…"; trace.textContent = "Attack Agent is generating a target-specific attack. This can take about a minute…";
        try {
          const response = await fetch("/api/live", { method: "POST", headers: { "Content-Type": "application/json", "X-Agent-Antibody-Client": "live-demo" }, body: "{}" });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
          renderRuns(data, true);
        } catch (error) { trace.textContent = String(error); }
        finally { setBusy(false); liveButton.textContent = "Run live Gemini"; }
      });
      fetch("/api/live/status").then(response => response.json()).then(state => {
        liveButton.dataset.enabled = String(state.enabled);
        liveButton.disabled = !state.enabled;
        liveButton.title = state.enabled ? `Model: ${state.model}` : "Live Gemini is disabled on this deployment";
      }).catch(() => {});
    </script>
  </body>
</html>
